services:
  db:
    image: postgres:15
    container_name: test_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5443:5432"
    volumes:
      - ./test_pgdata:/var/lib/postgresql/data
    networks:
      - test-backend-network

  files:
    image: files:1.0.2
    ports:
      - "8020:8000"
    volumes:
      - ./storage:/app/storage
      - ./test_config.yaml:/config.yaml
    networks:
      - test-backend-network
    restart: always

  syncer:
    image: files:1.0.2
    command: python -m scripts.files_sync
    volumes:
      - ./storage:/app/storage
      - ./test_config.yaml:/config.yaml
    networks:
      - test-backend-network
    restart: always

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: test_frontend
    ports:
      - "5173:5173"
    networks:
      - test-backend-network
    depends_on:
      - files
    restart: always

  redis:
    image: redis:7
    container_name: test_redis
    ports:
      - "6378:6379"
    networks:
      - test-backend-network
    restart: always

networks:
  test-backend-network:
    driver: bridge
