[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short --disable-warnings --alluredir=allure-results
markers =
    smoke: smoke tests (quick validation)
    regression: regression tests (full suite)
    api: api testing
    ui: ui testing
    unit: unit tests
    slow: slow/long-running tests
    playwright: playwright ui tests
    selenium: selenium ui tests
    integration: end-to-end integration tests
    performance: performance/load tests

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Test discovery
python_paths = .
norecursedirs = .git .venv venv __pycache__ test_pgdata

# Timeout for tests (seconds)
timeout = 300

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

